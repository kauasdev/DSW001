<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Pessoas</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .error-msg {
            color: red;
            font-size: 0.85em;
            margin: 5px 0 0;
            min-height: 1em;
        }

        fieldset {
            border: none;
            padding: 0;
        }

        .checkbox-group {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: poin
        }
    </style>
</head>

<body>
    <h2>Cadastro de Pessoa</h2>
    <form id="pessoaForm" novalidate>
        <div class="campo">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required maxlength="100" />
            <p id="err-nome" class="error-msg"></p>
        </div>
        <div class="campo">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required maxlength="64" />
            <p id="err-username" class="error-msg"></p>
        </div>
        <div class="campo">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required maxlength="100" />
            <p id="err-email" class="error-msg"></p>
        </div>
        <div class="campo">
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" maxlength="20" />
            <p id="err-telefone" class="error-msg"></p>
        </div>
        <div class="campo">
            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required />
            <p id="err-dataNascimento" class="error-msg"></p>
        </div>
        <div class="campo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required />
            <p id="err-senha" class="error-msg"></p>
        </div>
        <div class="campo">
            <label for="senhaRepeticao">Repetir Senha:</label>
            <input type="password" id="senhaRepeticao" name="senhaRepeticao" required />
            <p id="err-senhaRepeticao" class="error-msg"></p>
        </div>
        <div class="campo checkbox-group">
            <fieldset>
                <legend><strong>Conhecimentos:</strong></legend>
                <label><input type="checkbox" name="conhecimentos" value="Java" /> Java</label><br />
                <label><input type="checkbox" name="conhecimentos" value="Spring Boot" /> Spring Boot</label>
                <label><input type="checkbox" name="conhecimentos" value="JavaScript" /> JavaScript</label>
                <label><input type="checkbox" name="conhecimentos" value="Angular" /> Angular</label><br />
                <label><input type="checkbox" name="conhecimentos" value="React" /> React</label>
                <p id="err-conhecimentos" class="error-msg"></p>
            </fieldset>
        </div>
        <button type="submit">Cadastrar Pessoa</button>
    </form>
    <script>
        // Limita a data de nascimento ao dia atual (sem permitir datas futuras)
        const hoje = new Date();
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        const dia = String(hoje.getDate()).padStart(2, '0');
        document.getElementById('dataNascimento').setAttribute('max', `${ano}-${mes}-${dia}`);
        document.getElementById('pessoaForm').addEventListener('submit', async (evt) => {
            evt.preventDefault();
            limparErros();
            const formEl = evt.target;
            // Coleta os checkboxes marcados em um array
            const conhecimentos = [];
            const opcoes = document.querySelectorAll('[name="conhecimentos"]:checked');
            for (const opcao of opcoes) {
                conhecimentos.push(opcao.value);
            }
            // Monta o objeto com os dados do formulário
            const dados = {
                nome: formEl.nome.value,
                username: formEl.username.value,
                email: formEl.email.value,
                telefone: formEl.telefone.value,
                dataNascimento: formEl.dataNascimento.value,
                senha: formEl.senha.value,
                senhaRepeticao: formEl.senhaRepeticao.value,
                conhecimentos: conhecimentos,
            };
            try {
                const response = await fetch('/pessoas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados),
                });
                if (!response.ok) {
                    const dadosErros = await response.json();
                    if (dadosErros.errors) {
                        exibirErros(dadosErros.errors);
                    }
                    return;
                }
                alert('Cadastro realizado com sucesso!');
                formEl.reset();
            } catch (error) {
                alert('Não foi possível conectar ao servidor.');
            }
        });
        function limparErros() {
            document.querySelectorAll('.error-msg').forEach(p => p.textContent = '');
        }
        function exibirErros(erros) {
            // Bean Validation retorna: [{ "field": "email", "defaultMessage": "..." }, ...]
            for (const erro of erros) {
                const el = document.getElementById(`err-${erro.field}`);
                if (el) {
                    el.textContent = erro.defaultMessage;
                }
            }
        }
    </script>
</body>
